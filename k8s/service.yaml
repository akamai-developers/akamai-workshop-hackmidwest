# The front door. On LKE, a Service of type LoadBalancer gets a NodeBalancer: the cluster creates
# one, named lke, your cluster's id, and 12 more characters, and deletes it when you delete this Service.
# Guide 04 renames it to hackmidwest-nb so you can find it in Cloud Manager and scripts/down.sh can too.
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: hackmidwest
spec:
  type: LoadBalancer
  selector:
    app: agent
  ports:
    - name: http
      port: 80
      targetPort: 8000
